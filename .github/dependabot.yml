version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /ui
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /shell
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: swift
    directory: /macos
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
