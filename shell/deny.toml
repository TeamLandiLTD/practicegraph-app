# cargo-deny: what the 281 crates compiled into practicegraph-shell.exe are
# allowed to be.
#
# This exe is signed and installed on other people's machines. Two failure
# modes matter and only one of them is loud:
#   - a known vulnerability          (advisories, below)
#   - a licence we may not ship      (licenses, below) - quieter, just as
#     expensive, and it surfaces at the worst possible moment
#
# Run locally:  cd shell && cargo deny check

[advisories]
# Anything with a published advisory fails the build. No "warn and forget"
# tier: an advisory we chose to ignore should be an explicit, dated entry
# below with a reason, not a silent warning nobody reads.
yanked = "deny"
ignore = []

[licenses]
# Approved redistribution expressions. Review the obligations of any new
# license before expanding this list; retain every dependency's own notices.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",          # file-level copyleft; we modify none of these files
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "NCSA",
]
confidence-threshold = 0.9

[bans]
# Several versions of the same crate is a smell worth seeing, not a failure:
# the Windows crates legitimately carry more than one.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only. A git dependency is a URL somebody can change under us,
# which is the whole supply-chain problem in one line.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
