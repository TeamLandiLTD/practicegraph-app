[package]
name = "practicegraph-shell"
version = "0.2.29"
edition = "2021"
description = "PracticeGraph native Windows shell: service host + tray + toasts (C-2). A thin shell over the core CLI (C-6); all writes go through the CLI (C-4)."
license = "Apache-2.0"

[[bin]]
name = "practicegraph-shell"
path = "src/main.rs"

[dependencies]
windows-service = "0.7"
# Native dashboard window (`app` mode): tao owns the window/event loop,
# wry hosts the evergreen WebView2. Pinned exact (spec: pin current stable).
tao = "=0.35.3"
wry = "=0.55.1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_EventLog",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows]
version = "0.61"
features = [
    "UI_Notifications",
    "Data_Xml_Dom",
    "Win32_System_WinRT",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
