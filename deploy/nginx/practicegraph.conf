# PracticeGraph — nginx TLS termination example.
#
# The PracticeGraph server binds loopback (127.0.0.1:8321) and speaks plain
# HTTP with bearer/basic credentials. It must NEVER be bound or published on a
# non-loopback interface without a TLS-terminating proxy like this one in
# front — the org token would travel in cleartext.
#
# Install: drop into /etc/nginx/conf.d/, replace the server_name and
# certificate paths, then `nginx -t && systemctl reload nginx`.

server {
    listen 80;
    listen [::]:80;
    server_name practicegraph.example-intranet;

    # Health passthrough on plain HTTP so dumb load-balancer probes work
    # before/without TLS. /healthz is unauthenticated and org-free (INV-2).
    location = /healthz {
        proxy_pass http://127.0.0.1:8321/healthz;
    }

    # Everything else: force TLS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name practicegraph.example-intranet;

    ssl_certificate     /etc/ssl/practicegraph/fullchain.pem;
    ssl_certificate_key /etc/ssl/practicegraph/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # HSTS: agents and dashboard browsers never downgrade to plaintext.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ingest payloads are capped server-side at 64 KiB (NFR-SEC-3);
    # reject oversized bodies at the edge too.
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The server keeps no per-client state and logs no addresses
        # (FR-API-6); these headers are for the proxy's own access log only.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
